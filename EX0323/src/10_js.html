<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        window.onload = function(){
            let sido_arr = ["서울", "대전", "대구" , "부산"];

            let sido = document.getElementById("sido");

            for(let i = 0; i < sido_arr.length; i++){
                let loction = document.createElement("option");
                loction.innerHTML = sido_arr[i];
                sido.appendChild(loction);
            }

            //생년월일 select option 생성
            let year = document.getElementById("year");
            let month = document.getElementById("month");

            //년도
            for(let i = 2017; i >= 1970; i--){
                let yearOption = document.createElement("option");
                yearOption.innerHTML = i + "년";
                yearOption.value = i;
                year.appendChild(yearOption);
            }

            //월
            for(let i = 12; i >=1; i--){
                let monthOption = document.createElement("option");
                monthOption.innerHTML = i + "월";
                monthOption.value = i;
                month.appendChild(monthOption);
            }

            //일 함수
            dayOptionFun();    

        }

        //일 ( 4, 400의 배수 는 윤년 100의 배수는 윤년에서 제외 )
        function dayOptionFun(){
            let year = Number(document.getElementById("year").value);
            let month = Number(document.getElementById("month").value);
            let day = document.getElementById("day");
            let endDay = 0;

            if(day.innerHTML !== "") day.innerHTML = "";

            switch(month){
                case 1:
                case 3:case 5: case 7: 
                case 8: case 10: case 12:
                    endDay = 31; 
                    break;
                case 4: case 6: case 9: case 11:
                    endDay = 30;
                    break;
                case 2:
                    endDay = 28;
            }

            //윤년이면 2월달에 하루 추가.
            if(month === 2 && (year % 4 === 0 || year % 400 === 0) && (year % 100 !== 0))
                endDay = 29;

            for(let i = endDay; i >= 1; i--){
                let dayOption = document.createElement("option");
                dayOption.innerHTML = i;
                day.appendChild(dayOption);
            }
            
        }

    </script>
</head>
<body>

    <p>
        지역
        <select id="sido">
            <option>::: 지역을 선택하세요 :::</option>
        </select>
    </p>
    <p>
        생년월일(1970~2017) : 
        <select id="year" onchange="dayOptionFun()"></select>
        <select id="month" onchange="dayOptionFun()"></select>
        <select id="day"></select>
    </p>

</body>
</html>
