<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        let a = 10;
        let b = 3;
        let result = a + b;

        document.write(result , "<br/>");

        result = a / b;
        document.write(`${result.toFixed(2)} <br/>`);

        let num1 = 10;
        let num2 = "10";

        // == : 타입 구별 없이 값이 같으면 True;
        // === : 타입까지 같으면 True;
        result = num1 === num2;
        document.write(`${result} <br/>`);

    </script>

</head>
<body>
    
</body>
</html>
