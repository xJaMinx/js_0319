<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // prompt로 1 ~ 12사이의 값을 받는다
        // 입력받은 값에 해당하는 월이 몇일까지 있는지 출력
        // --------------------------
        // 입력 : 5
        // 5월은 31일까지 있습니다.

        let m = Number(prompt("월을 입력하세요"));
        let result = "";
        switch(m){
            case 12: case 1: case 3:
            case 5: case 7: case 8:
            case 10:
                document.write(m , "월은 31일까지 있습니다.");
                break;
            case 4: case 6: case 9: case 11:
                document.write(m , "월은 30일까지 있습니다.");
                break;
            case 2:
                document.write(m , "월은 28일까지 있습니다.");
                break;
            default:
                document.write("존재하지않는 달입니다.");
        }

        


    </script>
</head>

</body>
</html>
