<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // 프롬프트를 통해서 국어, 영어, 수학점수를 받는다.
        // 세 과목의 총점과 평균을 (소수점 2자리까지) 출력

        let kor = Number(prompt("국어 점수는?"));
        let eng = Number(prompt("영어 점수는?"));
        let mh = Number(prompt("수학 점수는?"));
        let sum = kor + eng + mh;
        let avg = sum / 3;

        document.write(`총점 : ${sum} <br/>`);
        document.write("평균 : ", avg.toFixed(2) );


    </script>
</head>
<body>
    
</body>
</html>
