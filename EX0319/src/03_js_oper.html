<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        /*
            과수원이 있다.
            과수원에서 24시간 동안 생상되는 과일의 갯수는
            사과 5개, 오렌지 10개, 배 3개이다.
            과수원에서 하루에 생산되는 과일의 총 갯수를 출력하고
            1시간에 몇개의 과일이 생산되는지 출력하시오.
        */

        let apple = 5, orange = 10 , pear = 3;
        let sum = apple + orange + pear;
        let result = sum / 24;

        document.write(`하루 : ${sum} <br/> 1시간 : ${result}`);

    </script>
</head>

</body>
