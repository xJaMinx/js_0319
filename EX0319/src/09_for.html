<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        //구구단 출력

        let dan = Number(prompt("출력할 단을 입력하세요"));

        for(let i = 1; i <= 9; i++)
            document.write(`${dan} * ${i} = ${dan *  i}<br/>`);

        document.write("<hr/>");


        let str = "<ul>";
        
        for(let i = 1; i <= dan; i++)
            str += "<li>메뉴"+ i +"</li>";

        str += "</ul>";
        
        document.write(str);

    </script>
</head>
<body>
    
</body>
</html>
