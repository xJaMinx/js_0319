<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        
        let str = '<table border="1">';
        
        str += "<tr>";
        for(let i = 2; i <= 9; i++)
            str += `<th> ${i} 단</th>`;
        str += "</tr>";
            
        for(let i = 1; i <= 9; i++){
            str += "<tr>";
            for(let j = 2; j <= 9; j++) 
                str += `<td> ${j} * ${i} = ${i * j} </td>`;
            str += "</tr>";
        }

        str += "</table>";

        document.write(str);
    </script>
</head>
<body>
    
</body>
</html>
